<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog Tech & Auto</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            background-color: rgb(34, 20, 75);
            color: rgb(199, 176, 176);
            text-align: center;
            max-width: 880px;
            margin: 0 auto 20px auto;
            border: 5px solid #cf1010;
            padding: 16px;
            box-sizing: border-box;
        }

        main {
            background-color: #1a1a2e;
            color: #e0e0e0;
            max-width: 880px;
            margin: 0 auto;
            padding: 24px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .post-image {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu Blog Tech</h1>
        <p>Aqui vou colocar curiosidades e conhecimentos automotivos (carros, motos)</p>
    </header>

    <main>
        <article>
            <img class="post-image" src="carlos.png" alt="Carro esportivo moderno em alta velocidade em uma estrada sinuosa à beira-mar, com iluminação dramática ao pôr do sol e montanhas ao fundo.">
            
            <h2>Meu Primeiro Post</h2>
            <p><strong>Por:</strong> Carlos Cesare</p>
            <p>Boas-vindas ao meu blog! Aqui vou compartilhar dicas de programação, curiosidades e conhecimentos sobre automóveis.</p>
        </article>
    </main>

</body>
</html>
